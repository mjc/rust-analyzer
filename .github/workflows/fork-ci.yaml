name: Fork CI

on:
  push:
    branches: ["rusta/workspace-symbol-memory"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings -W unreachable-pub --cfg no_salsa_async_drops"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add --toolchain stable rust-src rustfmt clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt -- --check
      - run: cargo nextest run --no-fail-fast --hide-progress-bar
      - run: cargo clippy --all-targets -- -D clippy::disallowed_macros -D clippy::dbg_macro -D clippy::todo -D clippy::print_stdout -D clippy::print_stderr
